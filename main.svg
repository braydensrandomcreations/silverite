<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">Open Silverite</title>
  <desc id="description">Launch the Silverite app from its GitHub Pages site.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#aeb7ff" stop-opacity=".18"/><stop offset="1" stop-color="#090909" stop-opacity="0"/></radialGradient>
    <linearGradient id="button" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d8d8e0"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#090909"/>
  <ellipse cx="640" cy="300" rx="520" ry="360" fill="url(#glow)"/>
  <g fill="#f5f5f7" text-anchor="middle" font-family="Arial,sans-serif">
    <text x="640" y="260" font-size="92" font-weight="700" letter-spacing="-5">SILVERITE</text>
    <text x="640" y="318" fill="#aaaab4" font-size="22">Open the live app to use the proxy and games.</text>
  </g>
  <a href="https://braydensrandomcreations.github.io/silverite/" target="_blank" rel="noopener">
    <rect x="465" y="375" width="350" height="78" rx="14" fill="url(#button)"/>
    <text x="640" y="424" fill="#101014" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" pointer-events="none">OPEN SILVERITE</text>
  </a>
  <text x="640" y="510" fill="#777780" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">This SVG is a launcher; interactive app code runs on GitHub Pages.</text>
</svg>
