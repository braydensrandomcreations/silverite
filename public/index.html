<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Silverite — Retired</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0b0e14;color:#e8ecf3;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100svh;display:grid;place-items:center;padding:32px 20px}
  .card{max-width:620px;text-align:center}
  h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;margin:0 0 20px;letter-spacing:-.03em}
  p{font-size:1.05rem;line-height:1.7;color:#b9c2d0;margin:0 0 14px}
  .rule{width:52px;height:1px;background:#3a4354;margin:30px auto}
  small{color:#7e8999;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Silverite has retired.</h1>
    <p>Following a DMCA takedown request, Silverite has been shut down and its game library removed.</p>
    <p>Thanks to everyone who played, tested, and gave feedback. This page is all that remains.</p>
    <div class="rule" aria-hidden="true"></div>
    <small>November 2026</small>
  </div>
</main>
</body>
</html>
