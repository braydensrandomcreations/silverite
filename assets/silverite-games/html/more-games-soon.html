<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>More games soon!</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255,255,255,.06), transparent 35%),
        #090909;
      color: #f0f0f0;
      font-family: "Courier New", monospace;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 28px 24px;
      border: 1px solid #343434;
      border-radius: 10px;
      background: rgba(17,17,17,.92);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
    }
    .eyebrow {
      margin-bottom: 12px;
      color: #8b8b8b;
      font-size: 11px;
      letter-spacing: 2px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 20px;
      line-height: 1.35;
    }
    p {
      margin: 0;
      color: #c4c4c4;
      font-size: 13px;
      line-height: 1.6;
    }
    .dots {
      margin-top: 18px;
      color: #f0f0f0;
      font-size: 18px;
      letter-spacing: 6px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">SILVERITE GAMES</div>
    <h1>We will be adding more games soon!</h1>
    <p>This is not a game, just a teaser!</p>
    <div class="dots" aria-hidden="true">•••</div>
  </main>
</body>
</html>
